name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages + GitHub Actions source if not configured yet
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Empty BASE_PATH for username.github.io user site.
        # If deploying from a project repo instead, set:
        #   BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
        env:
          BASE_PATH: ""

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
